# Servidor RustDesk OSS no Linux.
# Rede do host: o hbbs enxerga o IP real de quem conecta.
# Portas no firewall do Linux (não abra 21118 nem 21119):
#   21115/tcp, 21116/tcp, 21116/udp, 21117/tcp
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: "host"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: "host"
    restart: unless-stopped
