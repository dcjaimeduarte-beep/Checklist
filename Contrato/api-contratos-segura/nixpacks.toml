[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@10 && pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter=@contratos/api exec prisma generate",
  "pnpm --filter=@contratos/api exec prisma db push --accept-data-loss",
  "pnpm --filter=@contratos/api build"
]

[start]
cmd = "node apps/api/dist/server.js"
